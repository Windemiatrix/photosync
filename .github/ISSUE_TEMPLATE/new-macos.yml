name: New macOS or Photos version
description: photosync does not support, or misbehaves on, a newer macOS or Photos version
title: "feat(compat): macOS "
labels: ["upstream"]
body:
  - type: markdown
    attributes:
      value: |
        Apple changes the structure of the Photos library between macOS versions. To add support for a new one, we need to know exactly which version you run and what photosync reports.

        **Do not attach `Photos.sqlite`, a Photos library or any file derived from it.** They contain your photo metadata. If maintainers need more information, they will ask for specific, non-personal facts (for example the table structure without any rows).
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu, About This Mac, for example "macOS 27.0 (build number)".
    validations:
      required: true
  - type: input
    id: photos
    attributes:
      label: Photos app version
      description: Photos menu, About Photos.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: photosync version
      description: Output of `photosync version`.
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: What photosync reports
      description: The error message or the output of `photosync doctor`. If it mentions a model number, keep it. Remove any names or paths of your own.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach a Photos library, `Photos.sqlite`, `plan.*`, `journal.jsonl` or `state.db`.
          required: true
