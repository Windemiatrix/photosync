name: Bug report
description: Something does not work as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Do not attach private files

        The files photosync writes contain the names of your albums, folders and files, paths in your cloud storage and identifiers of your photos. **Do not attach `plan.*`, `journal.jsonl`, `state.db` or any part of a Photos library (`Photos.sqlite`, `*.photoslibrary`).** This issue is public and cannot be fully deleted later.

        Paste only short excerpts, and replace real names, paths, dates, UUIDs and logins with neutral ones (`IMG_0001.HEIC`, `2024/05-01 - Holidays`, `user@example.com`). Never paste a password or a token.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command line (without secrets) and the minimal configuration that shows the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: photosync version
      description: Output of `photosync version`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and processor
      description: For example "macOS 15.2, Apple silicon".
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was photosync installed?
      options:
        - Release archive from GitHub
        - go install
        - Built from source
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and exit code
      description: Relevant lines only, with private data replaced. Run with `--verbose` if you can.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach `plan.*`, `journal.jsonl`, `state.db` or a Photos library, and I removed personal data and secrets from everything I pasted.
          required: true
