# A tag v* pushed by scripts/release.sh builds a draft GitHub Release. A step
# that also runs locally calls one Makefile target; the release step runs only
# here. No caches: they could be poisoned.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CGO_ENABLED: "1"
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Tag on main, library by a tag
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          bash scripts/check-release-deps.sh
      - name: Vet
        run: make vet
      - name: Tests and coverage
        run: make cover
      - name: govulncheck
        run: make vuln

  build:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and create the draft Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Bump together with GORELEASER_VERSION in the Makefile.
        run: go run github.com/goreleaser/goreleaser/v2@v2.18.3 release --clean --release-header-tmpl docs/release-notes-header.md
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
