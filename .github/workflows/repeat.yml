# A separate file: ci.yml has a weekly schedule of its own. Not a check of main:
# a flaky property must not turn an unrelated change red, so ci-ok does not
# wait for this workflow. A failure prints the rapid seed in the log.
name: repeat

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata

jobs:
  repeat:
    # The runner of the scale ceilings: they were calibrated on macos-15.
    runs-on: macos-15
    # The go test timeouts of the three steps added up, plus the setup; the
    # limit of a job is 6 h. Recalculate together with the timeouts.
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Modules
        id: modules
        run: go mod download
      # Nothing listens on port 9: a test that reaches the internet through an
      # HTTP client that reads HTTP(S)_PROXY fails at once. The setup steps above
      # (checkout, Go, modules) need the network, so only the test steps have it
      # cut.
      #
      # The scale tests run in their own step, once.
      - name: Tests, repeated
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: >-
          go test -race -shuffle=on -count=7 -timeout 1h
          -skip 'TestPlanScale|TestMatchScale' ./internal/...
      # -rapid.checks is accepted only by the packages that import rapid, so
      # their repeat is a second step. They run side by side, and the longest
      # one (plan) sets the time. The timeout keeps room for a runner slower
      # than the one measured. A failed step before does not hide the result of
      # this one, but there is nothing to test without the modules.
      - name: Properties, repeated
        if: ${{ !cancelled() && steps.modules.outcome == 'success' }}
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: >-
          go test -race -shuffle=on -count=7 -timeout 4h
          -skip 'TestPlanScale|TestMatchScale'
          ./internal/domain/naming/ ./internal/domain/layout/
          ./internal/domain/match/ ./internal/domain/plan/
          ./internal/domain/eventtpl/ ./internal/domain/pathtemplate/
          ./internal/testkit/gen/
          ./internal/testkit/refmodel/
          -rapid.checks=10000
      # -p 1: the ceilings assume that no other test runs beside the scale test.
      # The timeout is well above the sum of the scale ceilings in TestPlanScale
      # and TestMatchScale, so that a slowdown fails on a ceiling with its
      # numbers instead of "test timed out".
      - name: Scale tests
        if: ${{ !cancelled() && steps.modules.outcome == 'success' }}
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: >-
          go test -race -p 1 -shuffle=on -count=1 -cpu 1,4 -timeout 40m
          -run 'TestPlanScale|TestMatchScale'
          ./internal/domain/plan/ ./internal/domain/match/
