# Continuous integration.
#
# - "ci-ok" is the single aggregate check: the ruleset of main requires it, so
#   the names of the other jobs can change freely.
# - Every third-party action is pinned to a full commit SHA with its release
#   version in a comment; Dependabot keeps both up to date, and
#   scripts/check-repo.sh fails on any action that is not pinned by SHA.
# - Values from events (pull request titles, branch names) reach shell steps
#   only through env:, never through ${{ }} inside run:.
# - Jobs that need a longer history (fuzzing, repeated runs, mutation testing,
#   slow chaos tests) are added together with the code they run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "23 3 * * 0" # weekly, Sunday night UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Tests must not depend on the time zone of the machine.
  TZ: Asia/Kolkata

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-pr-title.sh

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The module cache is keyed on go.sum, which does not exist while the
          # module has no dependencies. Turn caching on with the first dependency.
          cache: false
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - name: Check coverage
        run: bash scripts/check-coverage.sh coverage.out

  macos:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The linter runs here, not on Linux, so that darwin-only files are analyzed.
      - name: Lint
        run: make lint
      - name: Test with cgo
        run: go test -race -shuffle=on ./...
      # The release pipeline on every pull request: both slices (the amd64 one
      # is a cgo cross-compilation), lipo, the ad-hoc signature and the archive,
      # without publishing. A broken release is found here, not after a tag is
      # pushed. The checkout is shallow and has no tags; if GoReleaser does not
      # work on it, add fetch-depth: 0 to the checkout above.
      - name: Build the release archive (snapshot)
        run: make release-snapshot

  repo-checks:
    runs-on: ubuntu-24.04
    # GoReleaser and actionlint are compiled from source (no cache).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Repository checks
        run: bash scripts/check-repo.sh
      # A broken .goreleaser.yaml must show up on the pull request: a tag is
      # immutable, so a failed release cannot be repeated on it.
      - name: Validate .goreleaser.yaml
        run: make release-check
      # Built from source at a fixed version; the module checksum database
      # verifies the download.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  deps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # MPL-2.0 is accepted for test-only dependencies (the property-test
          # library); it must not reach the shipped binary.
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, MPL-2.0, LicenseRef-scancode-google-patent-license-golang
          comment-summary-in-pr: never

  # Scheduled and manual only: a new vulnerability in a dependency must not
  # turn an unrelated pull request red. Not part of ci-ok.
  govulncheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  ci-ok:
    if: always()
    needs: [pr-title, linux, macos, repo-checks, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # A skipped job (for example pr-title on push) counts as passed; a failed
      # or cancelled one does not.
      - name: Every required job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
