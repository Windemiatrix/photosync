# A step that also runs locally calls one Makefile target or the action of the
# same tool and version; event values reach it only through env:. "ci-ok" is
# a check the ruleset of main requires; the PR title has its own workflow,
# pr-title.yml.
# Every push to main is released by the "release" job. The tests do not run
# again on that push: the ruleset of main merges only a branch that is up to
# date with main and green, so main gets exactly the tree the PR tested.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      major:
        description: "Release 1.0.0 (the move from 0.x is never made by a PR title)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TZ: Asia/Kolkata

jobs:
  # The app runs only on macOS, so the tests run only there.
  macos:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Modules
        run: make mod
      # The release binary instead of "go run": building golangci-lint from
      # source took most of the job.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Bump together with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.15.0
          skip-cache: true
      - name: Vet
        run: make vet
      - name: Tests and coverage with cgo
        run: make cover

  repo-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Repository checks
        run: make check-repo
      # shellcheck is preinstalled on the Ubuntu runner.
      - name: Shell scripts
        run: make lint-sh
      - name: Fixtures leak scan
        run: make fixtures-check

  deps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # MPL-2.0: test-only dependencies, never in the shipped binary.
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, MPL-2.0, LicenseRef-scancode-google-patent-license-golang
          comment-summary-in-pr: never

  # Not in ci-ok: a new vulnerability must not turn an unrelated change red.
  govulncheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: make vuln

  ci-ok:
    if: always()
    needs: [macos, repo-checks, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s' "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null

  # The version comes from the PR titles since the last tag (.svu.yml). The
  # GitHub Release creates the tag on the tested commit. No caches: they could
  # be poisoned.
  release:
    needs: [ci-ok]
    # A manual run without "major" is a check (govulncheck), not a release.
    # !cancelled(): without a status function GitHub adds success(), which is
    # false when any job before ci-ok was skipped (the tests on a push).
    if: >-
      !cancelled() && needs.ci-ok.result == 'success' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.major))
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: make vuln
      # svu needs a previous tag, so the first release is named here.
      - name: Version
        env:
          BUMP: ${{ inputs.major && 'major' || 'next' }}
        run: |
          if git describe --tags --abbrev=0 --match 'v*' >/dev/null 2>&1; then
            tag="$(make -s next-version BUMP="$BUMP")"
          else
            tag=v0.1.0
          fi
          echo "Release $tag"
          git tag "$tag"
      # The release binary instead of "go run": building GoReleaser from source
      # took more than two minutes.
      - name: Build and publish the Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Bump together with GORELEASER_VERSION in the Makefile, which runs it
          # locally (make release-snapshot).
          version: v2.18.3
          args: release --clean --release-header-tmpl docs/release-notes-header.md
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
